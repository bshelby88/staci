name: deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx vitest run          # tests-green is a merge condition, not a suggestion
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest services/*/tests -q
  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [tradingagents] }     # add services here; one line per launch
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -c services/${{ matrix.service }}/fly.toml
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
      - name: verify (third-party observable, charter §4)
        run: |
          sleep 10
          curl -sf "https://staci-${{ matrix.service }}.fly.dev/health"
          curl -sf "https://staci-${{ matrix.service }}.fly.dev/.well-known/x402"
