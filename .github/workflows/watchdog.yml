name: watchdog
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: heal staci-core
        run: |
          curl -sf https://staci-core.fly.dev/health || flyctl machines restart --app staci-core
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
      - name: sweep services (kill-gate + health)
        run: |
          for app in staci-tradingagents; do
            curl -sf "https://$app.fly.dev/health" || echo "::warning::$app unhealthy"
          done
