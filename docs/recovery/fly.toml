# fly.toml app configuration for RAE Monetization Gateway

app = "rae-monetization-gateway"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8090"
  BASE_WALLET = "0x9e6A95B5Bf1190B5aCD00508a8E9c72eDEd5fB60"

[[services]]
  protocol = "tcp"
  internal_port = 8090

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/healthz"
